# This is a "GitHub Actions workflow" — a script that GitHub itself runs on its own
# servers in response to events in this repo (here: pushes to main). This is standard
# software-engineering practice called CI/CD (Continuous Integration/Continuous
# Deployment) — instead of you running build/deploy commands by hand on your laptop,
# the same steps run automatically and identically every time, in a clean environment.
name: Deploy to GitHub Pages

on:
  # Run whenever code lands on main...
  push:
    branches: [main]
  # ...or manually, via the "Run workflow" button in the GitHub Actions tab.
  workflow_dispatch:

# Grant this workflow permission to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only let one deployment run at a time; if a new push comes in while one is running,
# cancel the older one rather than letting them race each other.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the static site
        run: npm run build
        env:
          # Injected as a build-time environment variable so the Odds API key never
          # has to be committed to the repo. Set in GitHub repo Settings -> Secrets
          # and variables -> Actions -> Repository secret, named VITE_ODDS_API_KEY.
          # Vite only exposes env vars prefixed with VITE_ to client code.
          VITE_ODDS_API_KEY: ${{ secrets.VITE_ODDS_API_KEY }}

      # React Router's BrowserRouter reads the real URL path (e.g. /standings),
      # but GitHub Pages is a plain static file server — it has no file at that
      # path, so a bookmark, phone refresh, or backgrounded-tab reload on any
      # route other than the homepage hits a raw GitHub 404 page instead of the
      # app. GitHub Pages' documented workaround is a 404.html: when it can't
      # find a matching file, it serves this instead (still with a real 404
      # HTTP status, but the app's own JS loads and boots, and BrowserRouter
      # then renders the correct route from the URL that's already in the
      # address bar). Copying the built index.html itself works here (rather
      # than a redirect script, which older tutorials use) because Vite's
      # `base: '/weekly-nfl-picks/'` config already bakes absolute asset paths
      # into index.html, so it loads correctly regardless of which URL served
      # it. Done as a build step (not a static file in public/) so it can never
      # drift out of sync with whatever index.html the current build produces.
      - name: Copy index.html to 404.html for client-side routing fallback
        run: cp dist/index.html dist/404.html

      - name: Upload build output as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
