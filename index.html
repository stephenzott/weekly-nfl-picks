<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luke's Annual $10 Donation</title>
    <!-- Two typefaces per STYLE_GUIDE.md's "Type" section: Courier Prime
         (typewriter face — masthead, headers, labels, buttons ONLY) and
         IBM Plex Sans (everything else — team names, dollar amounts,
         body copy). Loaded from Google Fonts rather than self-hosted
         files, since this is a static site with no build step for font
         assets. preconnect warms up the connection to fonts.gstatic.com
         before the stylesheet even finishes loading, shaving a bit of
         latency off the first render. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
